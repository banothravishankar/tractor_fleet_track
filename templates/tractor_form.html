{% extends "base.html" %}
{% block content %}
<h1>Onboard a tractor</h1>
<form method="post" class="card form">
  <label>Registration number <input name="reg_no" required placeholder="AP37TA1234"></label>
  <label>Make <input name="make" placeholder="Tata"></label>
  <label>Model <input name="model" placeholder="Prima 4028.S"></label>
  <label>Chassis number <input name="chassis_no"></label>
  <label>Engine number <input name="engine_no"></label>
  <label>Capacity (tons) <input name="capacity_tons" type="number" step="0.1"></label>
  <label>GPS device ID <input name="gps_device_id"></label>
  <button class="btn">Save and add documents</button>
</form>
{% endblock %}
